name: Astara Knowledge release

on:
  pull_request:
  push:
    tags: ["v*-astara.*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v6
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python3 scripts/verify_astara_release.py
      - run: python3 -m unittest deploy/astara-knowledge/compose_inventory_test.py
      - run: go test ./internal/astara ./internal/router ./internal/handler ./release
      - run: npm ci && npm test
        working-directory: frontend

  images:
    if: startsWith(github.ref, 'refs/tags/')
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            file: docker/Dockerfile.app
            context: .
          - image: web
            file: frontend/Dockerfile
            context: frontend
          - image: docreader
            file: docker/Dockerfile.docreader
            context: .
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        if: matrix.image == 'web'
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Build frontend assets
        if: matrix.image == 'web'
        working-directory: frontend
        run: npm ci && npm run build
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/youmucz/astara-knowledge-${{ matrix.image }}:0.1.0-astara.1
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/youmucz/astara-knowledge-${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
